name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio pytest-cov httpx
          if [ -f "backend/requirements.txt" ]; then
            pip install -r backend/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

      - name: Lint with Ruff
        run: |
          ruff check backend/ tests/ --ignore E501,E402,F401,F841 --exit-zero

      - name: Run Test Suite with Coverage
        env:
          TESTING: "true"
          ENVIRONMENT: "test"
        run: |
          pytest tests/ -v --cov=backend/services/decision_coach_service --cov-report=term-missing

      - name: Verify Repository Size (< 10 MB limit)
        run: |
          REPO_SIZE_KB=$(git count-objects -v | grep "^size:" | awk '{print $2}')
          echo "Total repository object size: ${REPO_SIZE_KB} KB"
          if [ -n "$REPO_SIZE_KB" ] && [ "$REPO_SIZE_KB" -gt 10240 ]; then
            echo "❌ Error: Repository size exceeds 10 MB strict limit!"
            exit 1
          fi
          echo "✅ Repository size check passed: ${REPO_SIZE_KB:-0} KB < 10240 KB"
