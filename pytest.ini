[pytest]
testpaths = tests backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    asyncio: mark test as async test
    unit: mark test as unit test
    integration: mark test as integration test
    accessibility: mark test as accessibility compliance test
    security: mark test as security verification test
    alignment: mark test as problem statement alignment test
